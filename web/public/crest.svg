<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="The Lord Erroll crest">
  <!--
    Placeholder heraldic mark in the restaurant's colours: a quartered shield,
    gold fleur-de-lis, crown and ribbon. Replace this file with the client's
    official crest artwork before go-live; nothing else needs to change.
  -->
  <defs>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C87A"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#9A7B1B"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M28 46 h144 v88 c0 44 -34 72 -72 92 c-38 -20 -72 -48 -72 -92 z"/>
    </clipPath>
  </defs>

  <!-- crown -->
  <g fill="url(#goldFace)" stroke="#6E5514" stroke-width="1.6">
    <path d="M46 38 l6 -22 l16 14 l14 -20 l12 20 l16 -14 l6 22 z"/>
    <rect x="44" y="36" width="112" height="9" rx="3"/>
  </g>
  <g fill="#8C1D2C" stroke="#6E5514" stroke-width="1">
    <circle cx="52" cy="15" r="4"/><circle cx="100" cy="9" r="4.5"/><circle cx="148" cy="15" r="4"/>
  </g>

  <!-- shield -->
  <g clip-path="url(#shieldClip)">
    <rect x="28" y="46" width="72" height="90" fill="#1E4032"/>
    <rect x="100" y="46" width="72" height="90" fill="#7C1A26"/>
    <rect x="28" y="136" width="72" height="94" fill="#7C1A26"/>
    <rect x="100" y="136" width="72" height="94" fill="#1E4032"/>

    <!-- fleur-de-lis, one to each quarter -->
    <g fill="url(#goldFace)">
      <g transform="translate(64,84) scale(0.9)">
        <path d="M0 -26 c7 9 7 16 0 22 c-7 -6 -7 -13 0 -22 z M-4 -2 c-12 -10 -22 -6 -22 4 c0 8 8 12 14 8 c-4 -6 0 -10 8 -4 z M4 -2 c12 -10 22 -6 22 4 c0 8 -8 12 -14 8 c4 -6 0 -10 -8 -4 z M-12 4 h24 v6 h-24 z M-3 10 h6 v18 c0 4 -3 6 -3 6 s-3 -2 -3 -6 z"/>
      </g>
      <g transform="translate(136,84) scale(0.9)">
        <path d="M0 -26 c7 9 7 16 0 22 c-7 -6 -7 -13 0 -22 z M-4 -2 c-12 -10 -22 -6 -22 4 c0 8 8 12 14 8 c-4 -6 0 -10 8 -4 z M4 -2 c12 -10 22 -6 22 4 c0 8 -8 12 -14 8 c4 -6 0 -10 -8 -4 z M-12 4 h24 v6 h-24 z M-3 10 h6 v18 c0 4 -3 6 -3 6 s-3 -2 -3 -6 z"/>
      </g>
      <g transform="translate(64,166) scale(0.9)">
        <path d="M0 -26 c7 9 7 16 0 22 c-7 -6 -7 -13 0 -22 z M-4 -2 c-12 -10 -22 -6 -22 4 c0 8 8 12 14 8 c-4 -6 0 -10 8 -4 z M4 -2 c12 -10 22 -6 22 4 c0 8 -8 12 -14 8 c4 -6 0 -10 -8 -4 z M-12 4 h24 v6 h-24 z M-3 10 h6 v18 c0 4 -3 6 -3 6 s-3 -2 -3 -6 z"/>
      </g>
      <g transform="translate(136,166) scale(0.9)">
        <path d="M0 -26 c7 9 7 16 0 22 c-7 -6 -7 -13 0 -22 z M-4 -2 c-12 -10 -22 -6 -22 4 c0 8 8 12 14 8 c-4 -6 0 -10 8 -4 z M4 -2 c12 -10 22 -6 22 4 c0 8 -8 12 -14 8 c4 -6 0 -10 -8 -4 z M-12 4 h24 v6 h-24 z M-3 10 h6 v18 c0 4 -3 6 -3 6 s-3 -2 -3 -6 z"/>
      </g>
