    <path d="M100 46 v184 M28 136 h144" stroke="url(#goldFace)" stroke-width="3"/>
  </g>
  <path d="M28 46 h144 v88 c0 44 -34 72 -72 92 c-38 -20 -72 -48 -72 -92 z"
